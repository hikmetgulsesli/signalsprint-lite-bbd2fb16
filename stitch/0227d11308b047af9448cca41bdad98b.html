<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gameplay - SignalSprint Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                "error-container": "#93000a",

                "on-error-container": "#ffdad6",
                "surface-container-highest": "#2d3449",
                "error": "#ffb4ab",
                "primary": "#8aebff",
                "on-secondary-container": "#ff93c8",
                "surface-container-lowest": "#060e20",
                "secondary-fixed-dim": "#ffafd3",
                "on-surface": "#dae2fd",
                "secondary": "#ffafd3",
                "tertiary-container": "#8cd523",
                "on-error": "#690005",
                "on-primary-fixed": "#001f25",
                "on-secondary": "#620040",
                "inverse-on-surface": "#283044",
                "secondary-fixed": "#ffd8e7",
                "on-primary-fixed-variant": "#004e5a",
                "background": "#0b1326",
                "tertiary-fixed-dim": "#91db2a",
                "primary-fixed": "#a2eeff",
                "surface-dim": "#0b1326",
                "on-tertiary-container": "#355800",
                "outline-variant": "#3c494c",
                "on-primary-container": "#005763",
                "primary-container": "#22d3ee",
                "surface-container": "#171f33",
                "surface-tint": "#2fd9f4",
                "secondary-container": "#85145a",
                "on-secondary-fixed-variant": "#85145a",
                "surface-container-low": "#131b2e",
                "surface-bright": "#31394d",
                "inverse-primary": "#006877",
                "surface-variant": "#2d3449"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",

                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "hud-gutter": "12px",
                "panel-padding": "16px",
                "container-margin": "24px",
                "unit": "4px",
                "grid-cell": "32px"
        },
        "fontFamily": {
                "display-lg": [
                        "Inter"
                ],
                "stat-label": [
                        "JetBrains Mono"

                "stat-value": [

},
    },
  }

<style>
  body {
    background-color: #0F172A;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .glow-primary {
    box-shadow: 0 0 12px rgba(138, 235, 255, 0.8);
  }
  .glow-text-primary {
    text-shadow: 0 0 8px rgba(138, 235, 255, 0.8);
  }
  .glow-secondary {
    box-shadow: 0 0 12px rgba(255, 175, 211, 0.8);
  }
  .glow-tertiary {
    box-shadow: 0 0 12px rgba(167, 242, 66, 0.8);
  }
  .glass-panel {
    background: rgba(45, 52, 73, 0.4);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body class="text-on-background min-h-screen flex flex-col relative overflow-hidden font-body-md text-body-md">
<!-- TopAppBar Component (from JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-hud-gutter h-16 bg-surface-container/30 backdrop-blur-xl border-b border-white/10 shadow-[0_0_15px_rgba(47,217,244,0.3)]">
<div class="font-display-lg text-display-lg font-black text-primary italic tracking-tighter hidden md:block">SIGNAL_SPRINT_LITE_V1.0</div>
<div class="font-display-lg-mobile text-display-lg-mobile font-black text-primary italic tracking-tighter md:hidden">SIGNAL_SPRINT</div>
<div class="flex items-center gap-4">
<button class="text-outline hover:bg-primary/20 hover:text-primary transition-all duration-300 active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">pause</span>
</button>
<button class="text-outline hover:bg-primary/20 hover:text-primary transition-all duration-300 active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- SideNavBar Component (from JSON) - Hidden on Mobile -->
<aside class="fixed left-0 top-0 h-full z-40 flex flex-col p-panel-padding bg-surface/80 backdrop-blur-md border-r border-white/20 h-screen w-64 pt-20 hidden md:flex">
<div class="mb-8 flex flex-col gap-2">
<div class="w-16 h-16 rounded-full bg-surface-container-high border border-primary flex items-center justify-center overflow-hidden mb-2">
<span class="material-symbols-outlined text-primary text-3xl">person</span>
</div>
<div class="font-hud-header text-hud-header text-primary">OPERATOR_01</div>
<div class="font-label-sm text-label-sm text-outline tracking-widest">RANK: ELITE</div>
</div>
<nav class="flex-1 flex flex-col gap-2">
<button class="flex items-center gap-4 p-3 font-label-sm text-label-sm uppercase tracking-widest bg-secondary-container text-on-secondary-container border-l-4 border-secondary hover:text-primary transition-colors active:translate-x-1 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">speed</span>
        Race
      </button>
<button class="flex items-center gap-4 p-3 font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant hover:bg-surface-variant/50 hover:text-primary transition-colors active:translate-x-1 duration-150">
<span class="material-symbols-outlined">directions_car</span>
        Garage
      </button>
<button class="flex items-center gap-4 p-3 font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant hover:bg-surface-variant/50 hover:text-primary transition-colors active:translate-x-1 duration-150">
<span class="material-symbols-outlined">leaderboard</span>
        Leaderboard
      </button>
<button class="flex items-center gap-4 p-3 font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant hover:bg-surface-variant/50 hover:text-primary transition-colors active:translate-x-1 duration-150">
<span class="material-symbols-outlined">settings</span>
        Config
      </button>
</nav>
<button class="mt-auto w-full py-3 bg-primary text-on-primary font-hud-header text-hud-header hover:bg-primary-container transition-colors glow-primary">
      GO_LIVE
    </button>
</aside>
<!-- BottomNavBar Component (from JSON) - Visible only on Mobile -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface-container-lowest/40 backdrop-blur-lg border-t border-white/10 shadow-[0_-4px_20px_rgba(0,0,0,0.5)] rounded-t-xl md:hidden">
<button class="flex flex-col items-center justify-center bg-primary/20 text-primary rounded-xl p-2 drop-shadow-[0_0_5px_rgba(47,217,244,0.6)] font-label-sm text-label-sm active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">bolt</span>
      Sprint
    </button>
<button class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary-container font-label-sm text-label-sm active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1">build</span>
      Upgrades
    </button>
<button class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary-container font-label-sm text-label-sm active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1">hub</span>
      Network
    </button>
</nav>
<!-- Main Playfield Area -->
<main class="flex-1 relative flex items-center justify-center pt-16 md:pl-64 pb-20 md:pb-0 overflow-hidden">
<!-- HUD Elements Overlay -->
<div class="absolute top-20 left-4 md:left-72 right-4 flex justify-between items-start pointer-events-none z-10">
<!-- Score & Multiplier -->
<div class="glass-panel p-panel-padding rounded border-l-4 border-l-secondary flex flex-col gap-1 w-48">
<div class="flex justify-between items-center">
<span class="font-stat-label text-stat-label text-outline tracking-wider">SCORE</span>
<span class="font-label-sm text-label-sm text-outline-variant">V.2.4</span>
</div>
<div class="font-stat-value text-stat-value text-primary glow-text-primary">24,500</div>
<div class="text-tertiary font-stat-label text-stat-label mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">flash_on</span>
          x5 MULTIPLIER
        </div>
</div>
<!-- Level & Energy -->
<div class="glass-panel p-panel-padding rounded flex flex-col gap-3 w-64 items-end">
<div class="flex justify-between items-center w-full">
<span class="font-stat-label text-stat-label text-outline tracking-wider">LEVEL 3</span>
<span class="font-stat-label text-stat-label text-primary">OVERDRIVE READY</span>
</div>
<!-- Energy Bar -->
<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden border border-white/10">
<div class="h-full bg-secondary w-[85%] glow-secondary relative">
<div class="absolute inset-0 bg-white/20 animate-pulse"></div>
</div>
</div>
</div>
</div>
<!-- The Grid Playfield -->
<div class="relative w-full max-w-2xl h-[716px] border border-primary/20 rounded-lg overflow-hidden bg-surface-container-lowest/50 backdrop-blur-sm flex flex-col items-center justify-end pb-12 perspective-[1000px]">
<!-- Central Target Area -->
<div class="absolute bottom-16 w-full h-12 border-y-2 border-primary/50 flex justify-center gap-8 items-center bg-primary/5">
<div class="w-16 h-16 border-2 border-primary rounded-full flex items-center justify-center glow-primary bg-surface/50">
<span class="material-symbols-outlined text-primary text-3xl">keyboard_arrow_down</span>
</div>
<div class="w-16 h-16 border-2 border-primary rounded-full flex items-center justify-center glow-primary bg-surface/50">
<span class="material-symbols-outlined text-primary text-3xl">keyboard_arrow_down</span>
</div>
<div class="w-16 h-16 border-2 border-primary rounded-full flex items-center justify-center glow-primary bg-surface/50">
<span class="material-symbols-outlined text-primary text-3xl">keyboard_arrow_down</span>
</div>
</div>
<!-- Incoming Pulses (Visual Mockup) -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 flex gap-8">
<div class="w-12 h-12 bg-secondary rounded-full blur-[2px] opacity-80 glow-secondary transform -translate-x-24"></div>
<div class="w-12 h-12 bg-tertiary rounded-full blur-[2px] opacity-80 glow-tertiary transform translate-y-12"></div>
<div class="w-12 h-12 bg-primary rounded-full blur-[2px] opacity-80 glow-primary transform translate-x-24 translate-y-24"></div>
</div>
<!-- Visual Feedback Tags -->
<div class="absolute top-1/2 left-1/4 font-stat-value text-stat-value text-tertiary animate-bounce glow-text-primary">COMBO!</div>
<div class="absolute top-2/3 right-1/4 font-stat-value text-stat-value text-error opacity-70">MISS</div>
<!-- Controls Overlay (When Paused/Not Running) -->
<div class="absolute inset-0 bg-surface/80 backdrop-blur-md flex flex-col items-center justify-center gap-6 z-20">
<h2 class="font-display-lg text-display-lg text-primary glow-text-primary tracking-tighter italic">SYSTEM PAUSED</h2>
<div class="flex flex-col gap-4 w-64">
<button class="w-full py-4 border border-primary bg-primary/10 text-primary font-hud-header text-hud-header hover:bg-primary/20 hover:glow-primary transition-all duration-300 rounded uppercase flex items-center justify-center gap-2">
<span class="material-symbols-outlined">play_arrow</span>
            RESUME
          </button>
<button class="w-full py-4 border border-outline text-outline font-hud-header text-hud-header hover:bg-surface-variant hover:text-on-surface-variant transition-all duration-300 rounded uppercase flex items-center justify-center gap-2">
<span class="material-symbols-outlined">refresh</span>
            RESTART
          </button>
</div>
<p class="font-label-sm text-label-sm text-outline-variant mt-4">PRESS [ESC] TO RESUME</p>
</div>
</div>
</main>
</body></html>
