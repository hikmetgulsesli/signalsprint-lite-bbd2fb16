<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Settings - SignalSprint Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                    "colors": {
                        "on-tertiary": "#1f3700",
                        "on-background": "#dae2fd",
                        "tertiary": "#a7f242",

                        "primary-fixed-dim": "#2fd9f4",
                        "on-tertiary-fixed": "#102000",
                        "inverse-surface": "#dae2fd",
                        "on-primary": "#00363e",
                        "surface": "#0b1326",
                        "tertiary-fixed": "#acf847",
                        "outline": "#859397",
                        "on-tertiary-fixed-variant": "#304f00",
                        "on-secondary-fixed": "#3d0026",
                        "error-container": "#93000a",
                        "surface-container-high": "#222a3d",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#2d3449",
                        "error": "#ffb4ab",
                        "primary": "#8aebff",
                        "on-secondary-container": "#ff93c8",
                        "surface-container-lowest": "#060e20",
                        "secondary-fixed-dim": "#ffafd3",
                        "on-surface": "#dae2fd",
                        "secondary": "#ffafd3",
                        "tertiary-container": "#8cd523",
                        "on-error": "#690005",
                        "on-primary-fixed": "#001f25",
                        "on-secondary": "#620040",
                        "inverse-on-surface": "#283044",
                        "secondary-fixed": "#ffd8e7",
                        "on-primary-fixed-variant": "#004e5a",
                        "background": "#0b1326",
                        "tertiary-fixed-dim": "#91db2a",
                        "primary-fixed": "#a2eeff",
                        "surface-dim": "#0b1326",
                        "on-tertiary-container": "#355800",
                        "outline-variant": "#3c494c",
                        "on-primary-container": "#005763",
                        "primary-container": "#22d3ee",
                        "surface-container": "#171f33",
                        "surface-tint": "#2fd9f4",
                        "secondary-container": "#85145a",
                        "on-secondary-fixed-variant": "#85145a",
                        "surface-container-low": "#131b2e",
                        "surface-bright": "#31394d",
                        "inverse-primary": "#006877",
                        "surface-variant": "#2d3449"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "hud-gutter": "12px",
                        "panel-padding": "16px",
                        "container-margin": "24px",
                        "unit": "4px",
                        "grid-cell": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "stat-label": ["JetBrains Mono"],
                        "stat-value": ["JetBrains Mono"],
                        "label-sm": ["JetBrains Mono"],

                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "stat-label": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
                        "stat-value": ["24px", { "lineHeight": "1", "letterSpacing": "-0.05em", "fontWeight": "700" }],
                        "label-sm": ["10px", { "lineHeight": "1", "fontWeight": "400" }],

                }
            }

<style>
        body {
            background-color: #0F172A;
            /* Placeholder background grid simulating game environment */
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        
        .glow-primary {
            box-shadow: 0 0 12px 0 rgba(47, 217, 244, 0.5);
        }
        
        .glow-secondary {
            box-shadow: 0 0 12px 0 rgba(255, 175, 211, 0.5);
        }

        .hud-border {
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none; /* Hides the slider so that custom slider can be made */
            width: 100%; /* Specific width is required for Firefox. */
            background: transparent; /* Otherwise white in Chrome */
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 8px;
            background: theme('colors.primary');
            cursor: pointer;
            box-shadow: 0 0 8px theme('colors.primary');
            margin-top: -6px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-on-surface font-body-md min-h-screen flex items-center justify-center p-container-margin overflow-hidden relative">
<!-- Ambient Game Elements behind Modal -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-1/4 left-1/4 w-32 h-32 bg-secondary rounded-full mix-blend-screen filter blur-[100px] opacity-30"></div>
<div class="absolute bottom-1/3 right-1/4 w-48 h-48 bg-primary rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
</div>
<!-- Main Settings Modal (Level 2: The Glass) -->
<main class="relative z-10 w-full max-w-md bg-surface-container-high/80 backdrop-blur-xl hud-border rounded-lg p-panel-padding shadow-[0_0_30px_rgba(0,0,0,0.8)]">
<!-- Header -->
<header class="flex justify-between items-start mb-8 border-b border-white/10 pb-4">
<div>
<h1 class="font-hud-header text-hud-header text-primary tracking-wide">SYSTEM_CONFIG</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-widest">SignalSprint V1.0</p>
</div>
<div class="font-stat-label text-stat-label text-outline bg-surface-container px-2 py-1 rounded">
                v1.0.4b
            </div>
</header>
<div class="space-y-8">
<!-- Section: Pulse Velocity (Difficulty) -->
<section class="space-y-3">
<div class="flex justify-between items-center">
<h2 class="font-stat-label text-stat-label text-secondary uppercase tracking-wider">Pulse Velocity</h2>
<span class="font-stat-value text-stat-value text-on-surface" id="velocity-readout">NORMAL</span>
</div>
<div class="relative py-2">
<input class="w-full" id="velocity-slider" max="4" min="1" type="range" value="2"/>
<div class="flex justify-between font-label-sm text-label-sm text-outline mt-2 px-1">
<span>SLOW</span>
<span>NORMAL</span>
<span>FAST</span>
<span class="text-secondary">HYPER</span>
</div>
</div>
</section>
<!-- Section: Audio Controls -->
<section class="grid grid-cols-2 gap-4">
<div class="bg-surface/50 border border-white/5 p-3 flex items-center justify-between group hover:border-primary/50 transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-[20px]">music_note</span>
<span class="font-stat-label text-stat-label text-on-surface">Music</span>
</div>
<!-- Custom Toggle -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-9 h-4 bg-surface-variant peer-focus:outline-none rounded-none border border-white/10 peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-outline after:border-outline after:border after:h-3 after:w-4 after:transition-all peer-checked:bg-primary/20 peer-checked:after:bg-primary peer-checked:after:shadow-[0_0_8px_theme('colors.primary')]"></div>
</label>
</div>
<div class="bg-surface/50 border border-white/5 p-3 flex items-center justify-between group hover:border-primary/50 transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-[20px]">volume_up</span>
<span class="font-stat-label text-stat-label text-on-surface">SFX</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-9 h-4 bg-surface-variant peer-focus:outline-none rounded-none border border-white/10 peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-outline after:border-outline after:border after:h-3 after:w-4 after:transition-all peer-checked:bg-primary/20 peer-checked:after:bg-primary peer-checked:after:shadow-[0_0_8px_theme('colors.primary')]"></div>
</label>
</div>
</section>
<!-- Section: How to Play -->
<section class="bg-surface-container-highest/50 border-l-2 border-tertiary p-4 space-y-3">
<h2 class="font-stat-label text-stat-label text-tertiary uppercase tracking-wider flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">help</span>
                    How to Play
                </h2>
<div class="grid grid-cols-2 gap-2 font-label-sm text-label-sm text-on-surface-variant">
<div class="flex justify-between items-center bg-surface/40 px-2 py-1">
<span>Switch Lane</span>
<kbd class="bg-surface-bright text-primary border border-primary/30 px-2 py-0.5 rounded-sm">SPACE</kbd>
</div>
<div class="flex justify-between items-center bg-surface/40 px-2 py-1">
<span>Pause</span>
<kbd class="bg-surface-bright text-primary border border-primary/30 px-2 py-0.5 rounded-sm">P</kbd>
</div>
</div>
</section>
</div>
<!-- Action Footer -->
<footer class="mt-8 flex flex-col gap-3 pt-4 border-t border-white/10">
<button class="w-full bg-primary/10 border border-primary text-primary font-hud-header text-hud-header py-3 px-4 uppercase tracking-widest hover:bg-primary/20 hover:shadow-[0_0_15px_rgba(47,217,244,0.4)] transition-all active:scale-[0.98]">
                Save Changes
            </button>
<button class="w-full bg-transparent border border-outline/50 text-outline font-stat-label text-stat-label py-2 px-4 uppercase tracking-widest hover:text-on-surface hover:border-white/50 transition-colors">
                Back to Game
            </button>
</footer>
</main>
<script>
        // Simple script to update velocity readout
        const slider = document.getElementById('velocity-slider');
        const readout = document.getElementById('velocity-readout');
        const labels = ['SLOW', 'NORMAL', 'FAST', 'HYPER'];
        
        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value) - 1;
            readout.textContent = labels[val];
            if(val === 3) {
                readout.classList.remove('text-on-surface');
                readout.classList.add('text-secondary', 'drop-shadow-[0_0_8px_rgba(255,175,211,0.8)]');
            } else {
                readout.classList.add('text-on-surface');
                readout.classList.remove('text-secondary', 'drop-shadow-[0_0_8px_rgba(255,175,211,0.8)]');
            }
        });
    </script>
</body></html>
